plugins {
    id "com.android.application"
}

android {
    namespace "com.cherrychits.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.cherrychits.mobile"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3.0"
    }

    dependencies {
        implementation "androidx.biometric:biometric:1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
